[server]
headless = true
runOnSave = false
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#00685f"
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#172b3a"
font = "sans serif"

[client]
showErrorDetails = "none"
toolbarMode = "viewer"
