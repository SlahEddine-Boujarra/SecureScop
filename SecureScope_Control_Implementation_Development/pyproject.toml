[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securescope"
dynamic = ["version"]
description = "Workspace-isolated exposure management and ISO 27001 GRC platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.62,<1.63",
    "pandas>=2.2,<3",
    "pyarrow>=18,<25",
    "python-nmap>=0.7.1,<1",
    "python-gvm>=26.0.0,<27",
    "lxml>=5,<7",
    "python-dotenv>=1.0,<2",
    "psycopg2-binary>=2.9,<3",
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    "python-docx>=1.2,<2",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "cryptography>=50,<51",
    "pydantic>=2.11,<3",
]

[project.scripts]
securescope-migrate = "securescope.cli.run_migrations:main"
securescope-validate = "securescope.validation.full_stack_validation:main"
securescope-nuclei-worker = "securescope.scanners.nuclei.nuclei_worker_runner:main"
securescope-api = "securescope.api.runner:main"
securescope-evidence-worker = "securescope.evidence.evidence_worker:main"
securescope-membership = "securescope.cli.manage_membership:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"securescope.ui.components_v2" = ["*.js", "*.css"]
"securescope.ui" = ["styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["securescope"]

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]
ignore-paths = ["^tests/"]

[tool.pylint.format]
max-line-length = 100

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}
